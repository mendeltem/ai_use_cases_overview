<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Use Cases · Overview · Evidence · Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232B; --ink-soft:#3C525E; --ink-faint:#6E828C;
    --paper:#EEF0EC; --surface:#FBFBF9; --surface-2:#F4F5F1;
    --line:#D5DAD3; --line-strong:#BFC6BD;
    --petrol:#0E6E6C; --petrol-dark:#0A4F4E;
    --solid:#2E7D4F; --solid-bg:#E4F0E7;
    --mid:#B47D12; --mid-bg:#F5ECD6;
    --thin:#B4462F; --thin-bg:#F3E1DB;
    --prod:#0E6E6C; --early:#3E8A6B; --pilot:#B47D12; --research:#8B6BA0;
    --g-exp:#1668B0; --g-strong:#2F7DB8; --g-steady:#6C9BC0; --g-nascent:#94A0A8;
    --shadow:0 1px 2px rgba(22,35,43,.06), 0 6px 20px rgba(22,35,43,.05);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  a{color:var(--petrol)}
  .wrap{max-width:1180px; margin:0 auto; padding:0 22px}

  header.top{background:linear-gradient(180deg,#12242C 0%,#132A31 100%); color:#EAF0EE; position:relative; overflow:hidden; border-bottom:3px solid var(--petrol);}
  header.top::before{content:""; position:absolute; inset:0; background-image:linear-gradient(var(--petrol-dark) 1px,transparent 1px),linear-gradient(90deg,var(--petrol-dark) 1px,transparent 1px); background-size:34px 34px; opacity:.14; pointer-events:none;}
  .top .wrap{position:relative; padding-top:34px; padding-bottom:30px}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:#7FD0C4; margin:0 0 12px;}
  h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(28px,5vw,46px); line-height:1.04; margin:0 0 14px; letter-spacing:-.01em;}
  h1 .accent{color:#7FD0C4}
  .thesis{max-width:680px; color:#C4D3CF; font-size:16px; margin:0 0 22px}
  .thesis strong{color:#EAF0EE; font-weight:600}
  .dist{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-end; margin-top:6px}
  .dist-item{min-width:90px}
  .dist-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; line-height:1}
  .dist-label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#9FB4AF; margin-top:4px}
  .dist-num.s{color:#7ED09A}.dist-num.m{color:#E7C877}.dist-num.t{color:#E39A87}.dist-num.g{color:#7BB6E6}
  .dist-total .dist-num{color:#EAF0EE}

  .langtoggle{display:inline-flex; border:1px solid rgba(127,208,196,.4); border-radius:8px; overflow:hidden; flex-shrink:0}
  .langtoggle button{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em; padding:6px 12px; background:transparent; color:#9FB4AF; border:none; cursor:pointer; transition:.12s}
  .langtoggle button[aria-pressed="true"]{background:var(--petrol); color:#fff}
  .langtoggle button:focus-visible{outline:2px solid #7FD0C4; outline-offset:-2px}

  .legend{background:var(--surface); border-bottom:1px solid var(--line)}
  .legend .wrap{display:flex; flex-wrap:wrap; gap:22px; padding:13px 22px; align-items:center}
  .legend h3{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin:0 6px 0 0; font-weight:500}
  .lg-group{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  .lg{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft)}
  .meter{display:inline-flex; gap:2px}
  .seg{width:8px; height:12px; border-radius:1.5px; background:var(--line-strong)}
  .meter.q3 .seg:nth-child(-n+3){background:var(--solid)}
  .meter.q2 .seg:nth-child(-n+2){background:var(--mid)}
  .meter.q1 .seg:nth-child(-n+1){background:var(--thin)}
  .mpill{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.03em; padding:2px 8px; border-radius:20px; font-weight:500; white-space:nowrap}
  .m-prod{background:var(--prod); color:#fff}
  .m-early{background:var(--early); color:#fff}
  .m-pilot{background:var(--pilot); color:#fff}
  .m-research{background:transparent; color:var(--research); border:1px solid var(--research)}
  .garrow{font-weight:700; font-size:13px; line-height:1}
  .g-explosive{color:var(--g-exp)} .g-strong{color:var(--g-strong)} .g-steady{color:var(--g-steady)} .g-nascent{color:var(--g-nascent)}

  .controls{position:sticky; top:0; z-index:20; background:rgba(238,240,236,.93); backdrop-filter:blur(8px); border-bottom:1px solid var(--line-strong)}
  .controls .wrap{padding:11px 22px}
  .ctrl-row{display:flex; flex-wrap:wrap; gap:7px 6px; align-items:center; margin-bottom:8px}
  .ctrl-row:last-child{margin-bottom:0}
  .ctrl-label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-right:6px; min-width:78px}
  .chip{font-family:'Inter',sans-serif; font-size:12px; font-weight:500; padding:5px 11px; border-radius:20px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:.12s;}
  .chip:hover{border-color:var(--petrol); color:var(--petrol)}
  .chip[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .chip.q[aria-pressed="true"]{background:var(--petrol); border-color:var(--petrol)}
  .chip.g[aria-pressed="true"]{background:var(--g-exp); border-color:var(--g-exp)}
  .search{flex:1; min-width:170px; font-family:'Inter',sans-serif; font-size:13px; padding:6px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink);}
  .search:focus{outline:2px solid var(--petrol); outline-offset:1px; border-color:var(--petrol)}
  .count-out{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); white-space:nowrap}

  main{padding:24px 0 60px}
  .cluster{margin-bottom:10px}
  .cluster.hidden{display:none}
  .cl-head{display:flex; gap:15px; align-items:baseline; padding:20px 0 11px; border-top:1px solid var(--line); margin-top:10px}
  .cl-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; color:var(--petrol); line-height:1; min-width:34px}
  .cl-meta{flex:1}
  .cl-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; margin:0 0 3px; letter-spacing:-.01em}
  .cl-kern{font-size:13px; color:var(--ink-soft); margin:0}
  .cl-verdict{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.02em; color:var(--ink-faint); background:var(--surface-2); border:1px solid var(--line); padding:6px 11px; border-radius:7px; max-width:230px; line-height:1.4}
  .cl-tag{font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:2px 7px; border-radius:4px; margin-left:8px; vertical-align:middle}
  .cl-tag.phys{background:#E4EFEE; color:var(--petrol-dark)}
  .cl-tag.soft{background:#E7E2F0; color:#6B4E8E}
  .cl-tag.infra{background:#EDEBE4; color:#7A6A2E}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow); overflow:hidden; transition:.14s;}
  .card.hidden{display:none}
  .card:hover{border-color:var(--line-strong); transform:translateY(-1px)}
  .card-btn{width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:13px 14px 12px; font-family:inherit; color:inherit; display:block;}
  .card-btn:focus-visible{outline:2px solid var(--petrol); outline-offset:-2px}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:9px; margin-bottom:8px}
  .uc-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; line-height:1.2}
  .uc-prov{font-size:11px; color:var(--ink-faint); margin-top:2px; font-family:'JetBrains Mono',monospace; letter-spacing:.01em}
  .card-mid{display:flex; align-items:center; gap:8px; margin:9px 0 2px; flex-wrap:wrap}
  .metric{font-size:12.5px; color:var(--ink); line-height:1.4}
  .metric b{font-weight:600}
  /* Wachstum und Rechenlast teilen sich eine Zeile; frueher zwei getrennte Bloecke. */
  .metaline{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 7px; margin-top:9px; font-size:11.5px; color:var(--ink-soft)}
  .metaline .garrow{font-size:14px}
  .metaline .glabel{font-size:11px; color:var(--ink-soft)}
  .metaline .gpart{font-size:11px; color:var(--ink-soft)}
  .metaline .cpart{font-size:11px; color:var(--ink-faint)}
  .metaline .mdot{color:var(--line-strong)}
  .metaline .ci{font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase}
  .metaline .ci.ci3{color:#B4451F} .metaline .ci.ci2{color:#8A6A1F}
  .metaline .ci.ci1{color:var(--ink-faint)} .metaline .ci.ci0{color:var(--petrol)}
  .metaline .cknd{font-size:11px; color:var(--ink-faint)}
  .expand-hint{font-size:11px; color:var(--ink-faint); margin-top:9px; display:flex; align-items:center; gap:5px}

  /* Aufklappbare Bloecke: Legende, Zusatzfilter, Rechenbedarf-Argument. */
  .disclose{display:inline-flex; align-items:center; gap:7px; background:none; border:none; cursor:pointer; padding:0;
            font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--ink-faint); transition:.12s}
  .disclose:hover{color:var(--petrol)}
  .disclose:focus-visible{outline:2px solid var(--petrol); outline-offset:3px; border-radius:3px}
  .disclose .chev{transition:transform .18s; display:inline-block}
  .disclose[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .disclose .cnt{font-family:'Inter',sans-serif; letter-spacing:0; text-transform:none; color:var(--petrol); font-weight:600}
  .disclose .cnt:empty{display:none}
  #legendBody[hidden], #moreFilters[hidden], #warumBody[hidden]{display:none}
  #legendBody{display:flex; flex-wrap:wrap; gap:22px; align-items:center; width:100%; margin-top:11px}
  .brtoggle{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; letter-spacing:-.01em;
            text-transform:none; color:var(--ink); margin-bottom:4px}
  .brtoggle .chev{color:var(--ink-faint); font-size:13px}
  #bridgeBody[hidden]{display:none}
  #bridgeBody{margin-top:12px}
  #bridgeBody .brfig{margin-top:0; border-top:none; padding-top:0}
  .warum .disclose{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; letter-spacing:0;
                   text-transform:none; color:var(--ink)}
  .warum .disclose .chev{color:var(--ink-faint); font-size:12px}
  #warumBody{margin-top:9px}
  .chev{transition:transform .18s; display:inline-block}
  .card.open .chev{transform:rotate(90deg)}
  .detail{max-height:0; overflow:hidden; transition:max-height .28s ease; background:var(--surface-2); border-top:1px solid transparent}
  .card.open .detail{max-height:640px; border-top-color:var(--line)}
  .detail-in{padding:12px 14px 14px; font-size:12.5px; color:var(--ink-soft); line-height:1.55}
  .detail-in .src{margin-top:9px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-faint); letter-spacing:.01em}
  .detail-in .src b{color:var(--ink-soft); font-weight:500}
  .srclink{color:var(--petrol); text-decoration:none; border-bottom:1px solid rgba(14,110,108,.3); transition:.12s}
  .srclink:hover{border-bottom-color:var(--petrol); background:rgba(14,110,108,.06)}
  .srclink:focus-visible{outline:2px solid var(--petrol); outline-offset:2px}
  .detail-in .firms{margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; align-items:baseline}
  .detail-in .firms > b{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-soft); font-weight:500; letter-spacing:.01em; margin-right:2px}
  .firmlink{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--petrol); text-decoration:none; padding:1px 6px; border:1px solid var(--line); border-radius:4px; background:var(--surface-2); transition:.12s}
  .firmlink:hover{border-color:var(--petrol); background:rgba(14,110,108,.08)}
  .firmlink:focus-visible{outline:2px solid var(--petrol); outline-offset:1px}
  .flag{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:5px; margin-top:9px; font-weight:500}
  .flag.warn{background:var(--thin-bg); color:var(--thin)}
  .flag.note{background:var(--mid-bg); color:var(--mid)}
  .flag.good{background:var(--solid-bg); color:var(--solid)}
  .empty{text-align:center; padding:60px 20px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; font-size:13px; display:none}
  footer{border-top:1px solid var(--line); background:var(--surface); padding:22px 0 34px}
  footer .wrap{font-size:12px; color:var(--ink-faint); line-height:1.6}
  footer b{color:var(--ink-soft)}
  @media (max-width:640px){ .cl-head{flex-wrap:wrap} .cl-verdict{max-width:none; width:100%} .dist{gap:16px} .dist-num{font-size:25px} .topbar{flex-direction:column-reverse; align-items:flex-start} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important; scroll-behavior:auto!important} }

  /* ---- Bruecke zur Lieferkettenseite ---- */
  .bridge{background:var(--surface-2); border-bottom:1px solid var(--line)}
  .bridge .wrap{padding:26px 22px 28px; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px; align-items:start}
  .bridge h2{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 10px; letter-spacing:-.01em}
  .bridge p{margin:0 0 11px; color:var(--ink-soft); max-width:62ch}
  .bridge p b{color:var(--ink); font-weight:600}
  .bridge .brnote{font-size:12.5px; color:var(--ink-faint); margin:12px 0 0; border-left:2px solid var(--line-strong); padding-left:10px}
  .brcard{display:block; background:var(--surface); border:1px solid var(--line-strong);
          border-top:3px solid var(--petrol); padding:15px 16px 16px; text-decoration:none; color:inherit;
          box-shadow:var(--shadow)}
  .brcard:hover{border-color:var(--petrol)}
  .brcard .brk{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.16em;
               text-transform:uppercase; color:var(--petrol); display:block; margin-bottom:7px}
  .brcard .brt{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; display:block; margin-bottom:6px}
  .brcard .brs{font-size:13px; color:var(--ink-soft); display:block}
  .brcard .brgo{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--petrol);
                display:block; margin-top:11px}
  .brfig{display:flex; flex-wrap:wrap; gap:18px 26px; margin:14px 0 0; padding:13px 0 0; border-top:1px solid var(--line)}
  .brfig div{min-width:132px}
  .brfig b{font-family:'JetBrains Mono',monospace; font-size:17px; display:block; color:var(--petrol-dark)}
  .brfig span{font-size:12px; color:var(--ink-faint)}
  .warum{margin-top:20px; padding-top:16px; border-top:1px solid var(--line)}
  .warum h3{font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 9px}
  .chip.c[aria-pressed="true"]{border-color:#B4451F; color:#B4451F}
  @media(max-width:820px){ .bridge .wrap{grid-template-columns:1fr} }

  /* ---- Branchenabdeckung ---- */
  .luecken{background:var(--surface-2); border-top:1px solid var(--line)}
  .luecken .wrap{padding:30px 22px 34px}
  .luecken h2{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 10px}
  .luecken p{margin:0 0 11px; color:var(--ink-soft); max-width:76ch}
  .luecken p b{color:var(--ink); font-weight:600}
  .lk-kopf,.lk{display:grid; grid-template-columns:minmax(0,1.15fr) 72px 96px minmax(0,2.6fr); gap:12px;
       padding:7px 0; align-items:baseline}
  .lk-kopf{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.11em;
       text-transform:uppercase; color:var(--ink-faint); border-bottom:1px solid var(--line-strong); margin-top:16px}
  .lk{border-bottom:1px solid var(--line); font-size:13.5px}
  .lk-n{font-weight:600; color:var(--ink)}
  .lk-z,.lk-b{font-family:'JetBrains Mono',monospace; font-size:12.5px; text-align:right; color:var(--ink-soft)}
  .lk-f{color:var(--ink-faint); font-size:13px}
  @media(max-width:760px){
    .lk-kopf{display:none}
    .lk{grid-template-columns:1fr 60px; row-gap:2px}
    .lk-b{display:none} .lk-f{grid-column:1 / -1}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="h1"></h1>
      </div>
      <div class="langtoggle" role="group" aria-label="Language">
        <button id="btnEN" aria-pressed="true" onclick="setLang('en')">EN</button>
        <button id="btnDE" aria-pressed="false" onclick="setLang('de')">DE</button>
      <button id="btnMN" aria-pressed="false" onclick="setLang('mn')">МН</button>
      </div>
    </div>
    <p class="thesis" id="thesis"></p>
    <div class="dist" id="dist"></div>
  </div>
</header>

<section class="bridge">
  <div class="wrap">
    <div>
      <button class="disclose brtoggle" id="bridgeToggle" aria-expanded="false" aria-controls="bridgeBody"><span class="chev">▸</span><span id="brTitle"></span></button>
      <div id="bridgeBody" hidden>
        <div class="brfig">
          <div><b id="brF1v"></b><span id="brF1l"></span></div>
          <div><b id="brF2v"></b><span id="brF2l"></span></div>
          <div><b id="brF3v"></b><span id="brF3l"></span></div>
        </div>
        <p id="brP1"></p>
        <p id="brP2"></p>
        <p class="brnote" id="brNote"></p>
        <div class="warum">
          <button class="disclose" id="warumToggle" aria-expanded="false" aria-controls="warumBody"><span class="chev">▸</span><span id="cdTitle"></span></button>
          <div id="warumBody" hidden>
            <p id="cdP1"></p>
            <p id="cdP2"></p>
            <p class="brnote" id="cdNote"></p>
          </div>
        </div>
      </div>
    </div>
    <a class="brcard" href="https://mendeltem.github.io/AI_Companys/nvidia-oekosystem.html" target="_blank" rel="noopener">
      <span class="brk" id="brCardK"></span>
      <span class="brt" id="brCardT"></span>
      <span class="brs" id="brCardS"></span>
      <span class="brgo" id="brCardG"></span>
    </a>
  </div>
</section>

<section class="legend">
  <div class="wrap">
    <button class="disclose" id="legendToggle" aria-expanded="false" aria-controls="legendBody"><span class="chev">▸</span><span id="legendToggleTxt"></span></button>
    <div id="legendBody" hidden>
      <div class="lg-group">
        <h3 id="legDataH"></h3>
        <span class="lg"><span class="meter q3"><i class="seg"></i><i class="seg"></i><i class="seg"></i></span><span id="legSolid"></span></span>
        <span class="lg"><span class="meter q2"><i class="seg"></i><i class="seg"></i><i class="seg"></i></span><span id="legMid"></span></span>
        <span class="lg"><span class="meter q1"><i class="seg"></i><i class="seg"></i><i class="seg"></i></span><span id="legThin"></span></span>
      </div>
      <div class="lg-group">
        <h3 id="legMatH"></h3>
        <span class="lg"><span class="mpill m-prod" id="legProd"></span></span>
        <span class="lg"><span class="mpill m-early" id="legEarly"></span></span>
        <span class="lg"><span class="mpill m-pilot" id="legPilot"></span></span>
        <span class="lg"><span class="mpill m-research" id="legRes"></span></span>
      </div>
      <div class="lg-group">
        <h3 id="legGrowH"></h3>
        <span class="lg"><span class="garrow g-explosive">⇈</span><span id="legGExp"></span></span>
        <span class="lg"><span class="garrow g-strong">↑</span><span id="legGStr"></span></span>
        <span class="lg"><span class="garrow g-steady">↗</span><span id="legGSte"></span></span>
        <span class="lg"><span class="garrow g-nascent">◦</span><span id="legGNas"></span></span>
      </div>
    </div>
  </div>
</section>

<section class="controls">
  <div class="wrap">
    <div class="ctrl-row" id="clusterChips"><span class="ctrl-label" id="lblCluster"></span></div>

    E("PJM sees up to <b>30 GW</b> of new data-centre demand 2025–2030; FERC ordered enhanced load forecasting","PJM erwartet bis zu <b>30 GW</b> neue Rechenzentrumslast 2025–2030; FERC ordnete verbesserte Lastprognose an"),
    E("Two separate things run under one heading. Forecasting and asset health are in production at most large utilities: gradient-boosted trees and sequence models on smart-meter intervals, weather and calendar data, plus predictive maintenance on transformers and rights-of-way. Queue and planning work is newer — PJM began a multi-year collaboration with Google in April 2025 to speed up interconnection processing. FERC directed PJM in December 2025 to report on enhanced load forecasting and demand flexibility by 19 January 2026. Note the loop: the load being forecast is largely created by the AI build-out this board describes. For the compute question this card is deliberately rated light — the models are small and the optimisation core (Volt-VAR, topology reconfiguration) is solver work, not deep learning.","Zwei verschiedene Dinge unter einer Überschrift. Prognose und Anlagenzustand laufen bei den meisten großen Versorgern produktiv: Gradient-Boosting und Sequenzmodelle auf Smart-Meter-Intervallen, Wetter- und Kalenderdaten, dazu vorausschauende Wartung an Transformatoren und Trassen. Neuer ist die Warteschlangen- und Planungsarbeit — PJM startete im April 2025 eine mehrjährige Zusammenarbeit mit Google zur Beschleunigung der Netzanschlussbearbeitung. FERC wies PJM im Dezember 2025 an, bis zum 19.1.2026 über verbesserte Lastprognose und Nachfrageflexibilität zu berichten. Die Schleife beachten: die prognostizierte Last entsteht großenteils durch den KI-Ausbau, den dieses Board beschreibt. Für die Rechenfrage ist die Karte bewusst gering eingestuft — die Modelle sind klein und der Optimierungskern (Volt-VAR, Topologie-Rekonfiguration) ist Solver-Arbeit, kein Deep Learning."),

  U(3,"WEF Lighthouse sites, Rockwell, Cognex, Landing AI","prod",2,"steady",
    E("Visual inspection & predictive maintenance","Visuelle Prüfung & vorausschauende Instandhaltung"),
    E("the workhorse case, quietly everywhere","der Arbeitspferd-Fall, unauffällig überall"),
    E("Rockwell Singapore, verified 2026: productivity <b>+43%</b>, defects <b>-35%</b>, time-to-competency -67%","Rockwell Singapur, verifiziert 2026: Produktivität <b>+43%</b>, Ausschuss <b>-35%</b>, Einarbeitungszeit -67%"),
    E("Cameras and prediction, the two things mass production actually buys AI for. Defect detection on the line, and vibration, acoustic and thermal monitoring that schedules a repair before the machine stops. The only cross-company set of vetted figures is the WEF Global Lighthouse Network, which reached 238 sites in June 2026 and reports generative AI as 23% of top solutions in 2025. Its newest example with published numbers is Rockwell Automation's Singapore plant, admitted June 2026 after deploying more than 50 digital and AI solutions including AI quality control and intelligent maintenance: labour productivity per person-hour up 43%, defects down 35%, time-to-competency down 67%. Two caveats. The Lighthouse sites are self-nominated and the figures are site-reported, so this is a selected sample of successes, not a population estimate. And for the compute question this card is deliberately light: inline inspection runs on embedded vision hardware and maintenance models are small, so the economic effect is large and the GPU demand is not.","Kameras und Vorhersage, die beiden Dinge, für die Massenfertigung tatsächlich KI kauft. Fehlererkennung an der Linie, und Schwingungs-, Schall- und Wärmeüberwachung, die eine Reparatur einplant, bevor die Maschine steht. Die einzige firmenübergreifende Sammlung geprüfter Zahlen ist das Global Lighthouse Network des WEF, das im Juni 2026 238 Standorte erreichte und generative KI mit 23% der Top-Lösungen für 2025 ausweist. Das jüngste Beispiel mit veröffentlichten Zahlen ist Rockwell Automations Werk in Singapur, aufgenommen im Juni 2026 nach Einführung von über 50 digitalen und KI-Lösungen einschließlich KI-Qualitätskontrolle und intelligenter Instandhaltung: Arbeitsproduktivität je Personenstunde plus 43%, Ausschuss minus 35%, Einarbeitungszeit minus 67%. Zwei Vorbehalte. Die Lighthouse-Standorte bewerben sich selbst und die Zahlen sind standortberichtet, das ist also eine ausgewählte Stichprobe von Erfolgen, keine Grundgesamtheit. Und für die Rechenfrage ist die Karte bewusst gering: Inline-Prüfung läuft auf eingebetteter Bildverarbeitung und Instandhaltungsmodelle sind klein, der wirtschaftliche Effekt ist also groß und die GPU-Nachfrage nicht."),
    E("WEF Global Lighthouse Network (Jun 2026); Rockwell/Singapore EDB","WEF Global Lighthouse Network (Juni 2026); Rockwell/Singapore EDB"),
    "note", E("vetted sites, but self-selected and self-reported","geprüfte Standorte, aber selbst gewählt und selbst berichtet")),
  U(3,"Tata Steel Kalinganagar, POSCO, ArcelorMittal, BASF","prod",2,"steady",
    E("Process industry: metallurgy & chemicals","Prozessindustrie: Metallurgie & Chemie"),
    E("deployed at scale, effects almost entirely self-reported","großflächig im Einsatz, Wirkung fast nur selbst berichtet"),
    E("Tata Steel Kalinganagar runs <b>260+ algorithms</b> in real-time decisions and is a WEF Lighthouse site; POSCO reports higher daily pig-iron output at lower fuel","Tata Steel Kalinganagar fährt <b>260+ Algorithmen</b> in Echtzeitentscheidungen und ist WEF-Lighthouse-Standort; POSCO meldet höhere Roheisen-Tagesleistung bei geringerem Brennstoffeinsatz"),
    E("Continuous processes are the oldest home of model predictive control, and the AI layer sits on top of it: burden composition and blast parameters on the furnace, endpoint carbon and temperature in the converter, roll gap and cooling in the mill, reaction conditions and catalyst screening in chemicals. Deployment is documented — Tata Steel's Kalinganagar plant is a WEF Lighthouse with a single data platform from ore to shipment, POSCO runs its PosFrame platform with edge inference on rolling-mill assets, ArcelorMittal runs blast-furnace optimisation and predictive maintenance across sites. The effects are not documented in the same sense. Almost every percentage in this field comes from company communications or from vendors selling the platform, the same claim appears with different numbers in different places, and there is no independent audit. Treat the direction as established and every specific figure as unverified. Compute-wise this is the clearest counter-example to the idea that industrial AI means GPU demand: model predictive control and small forecasting models run on plant hardware.","Kontinuierliche Prozesse sind die älteste Heimat der modellprädiktiven Regelung, und die KI-Schicht sitzt darauf: Möllerzusammensetzung und Windparameter am Hochofen, Endkohlenstoff und Temperatur im Konverter, Walzspalt und Kühlung im Walzwerk, Reaktionsbedingungen und Katalysatorsuche in der Chemie. Der Einsatz ist dokumentiert — Tata Steels Werk Kalinganagar ist WEF-Lighthouse-Standort mit einer durchgehenden Datenplattform von der Erzgewinnung bis zum Versand, POSCO betreibt seine PosFrame-Plattform mit Edge-Inferenz an Walzwerksaggregaten, ArcelorMittal fährt Hochofenoptimierung und vorausschauende Instandhaltung über mehrere Standorte. Die Wirkung ist nicht im selben Sinn dokumentiert. Fast jeder Prozentwert in diesem Feld stammt aus Firmenkommunikation oder von Anbietern, die die Plattform verkaufen, dieselbe Behauptung erscheint mit verschiedenen Zahlen an verschiedenen Stellen, und eine unabhängige Prüfung gibt es nicht. Die Richtung gilt als belegt, jede konkrete Zahl als ungeprüft. Für die Rechenfrage ist das das klarste Gegenbeispiel zu der Vorstellung, industrielle KI bedeute GPU-Nachfrage: modellprädiktive Regelung und kleine Prognosemodelle laufen auf Anlagentechnik."),
    E("WEF Lighthouse listing (Tata Kalinganagar); company communications","WEF-Lighthouse-Liste (Tata Kalinganagar); Firmenkommunikation"),
    "warn", E("deployment documented, every effect figure is a company claim","Einsatz dokumentiert, jede Wirkungszahl ist Firmenangabe")),

    E("The anti-bureaucracy case, and the only one here where the customer is the state itself. The UK runs a suite called Humphrey — Consult for consultation responses, Parlex for parliamentary debate, Lex for legal research, Minute for meeting records, Redbox for drafting. First live use was a Scottish Government consultation on non-surgical cosmetic procedures, 2,000+ responses across six qualitative questions, where Consult ranked the key themes nearly identically to the human analyst team who reviewed every response in parallel. Read the numbers carefully. What is realised: 38 consultations across 10 departments, three published evaluations (Scottish Government, Defra, DWP), scaling planned for 2027. What is projected: the 75,000 days and £20M refer to the full annual manual baseline, not to savings already booked. The minister's \"1,000 times faster and 400 times cheaper\" is a claim, not a measurement.","Der Anti-Bürokratie-Fall, und der einzige hier, bei dem der Kunde der Staat selbst ist. Das Vereinigte Königreich betreibt eine Werkzeugsammlung namens Humphrey — Consult für Konsultationsantworten, Parlex für Parlamentsdebatten, Lex für Rechtsrecherche, Minute für Sitzungsprotokolle, Redbox für Entwürfe. Erster Echteinsatz war eine Konsultation der schottischen Regierung zu nichtchirurgischen kosmetischen Eingriffen, über 2.000 Antworten zu sechs qualitativen Fragen, bei der Consult die Hauptthemen nahezu identisch zum menschlichen Analystenteam einordnete, das parallel jede Antwort geprüft hatte. Die Zahlen genau lesen. Realisiert: 38 Konsultationen in 10 Ressorts, drei veröffentlichte Auswertungen (schottische Regierung, Defra, DWP), Ausrollung für 2027 geplant. Prognostiziert: die 75.000 Tage und 20 Mio £ beziehen sich auf die gesamte jährliche manuelle Grundlast, nicht auf bereits gebuchte Einsparungen. Das ministerielle „1.000-mal schneller und 400-mal billiger\" ist eine Behauptung, keine Messung."),

    E("Two competing architectures, and the difference matters for the hardware layer. Ericsson puts AI on purpose-built ASICs inside the base station and optimises radio performance. NVIDIA and Nokia redefine the base station as a GPU server: NVIDIA introduced the Arc Aerial RAN Computer in October 2025 alongside a $1bn equity investment in Nokia (166,389,351 new shares at $6.01, ~2.9%). Nokia names nine tier-one operators as engaged; T-Mobile US is the only one with a public timeline — field trial 2026, commercial 2027, mass deployment 2028. The open question is whether the GPU power draw is justified against purpose-built silicon. This is the one case on the board where 'edge' means data-centre-class GPUs at cell sites and central offices rather than embedded chips, so it converts into accelerator demand differently from the other edge entries.","Zwei konkurrierende Architekturen, und der Unterschied zählt für die Hardware-Ebene. Ericsson setzt KI auf zweckgebaute ASICs in der Basisstation und optimiert die Funkleistung. NVIDIA und Nokia definieren die Basisstation als GPU-Server um: NVIDIA stellte im Oktober 2025 den Arc Aerial RAN Computer vor, zusammen mit einer Beteiligung von 1 Mrd USD an Nokia (166.389.351 neue Aktien zu 6,01 USD, ~2,9%). Nokia nennt neun Tier-1-Betreiber als beteiligt; nur T-Mobile US hat einen öffentlichen Zeitplan — Feldtest 2026, kommerziell 2027, Massenausrollung 2028. Offen ist, ob der GPU-Stromverbrauch gegen zweckgebautes Silizium zu rechtfertigen ist. Dies ist der einzige Fall auf dem Board, bei dem „auf dem Gerät\" GPUs in Rechenzentrumsklasse an Mastenstandorten und in Vermittlungsstellen meint statt eingebetteter Chips, er schlägt also anders auf die Beschleunigernachfrage durch als die übrigen Edge-Einträge."),

    E("This is the layer that answers where the data comes from. Digital twins simulate a plant that exists; world foundation models generate environments that do not, so a policy can be trained on them. NVIDIA packages this as Cosmos, pairing world foundation models with tokenizers, guardrails and data tooling alongside Omniverse; DeepMind runs both cinematic generation and interactive world models with Genie; Microsoft Research built Muse as a world-and-human-action model with Ninja Theory. The interesting axis is not picture quality but action-conditioning: a model you can act inside is a simulator, one you can only watch is a film. For the compute question this is the heaviest kind of training on the board, and unlike the agent cards it does not depend on a language model being good enough to pay for tokens.","Diese Ebene beantwortet, woher die Daten kommen. Digital Twins simulieren eine Anlage, die existiert; Weltmodelle erzeugen Umgebungen, die es nicht gibt, damit eine Politik darauf trainiert werden kann. NVIDIA bündelt das als Cosmos, Weltmodelle zusammen mit Tokenizern, Guardrails und Datenwerkzeugen neben Omniverse; DeepMind betreibt sowohl kinematische Generierung als auch interaktive Weltmodelle mit Genie; Microsoft Research baute Muse als Welt- und Handlungsmodell mit Ninja Theory. Die interessante Achse ist nicht die Bildqualität, sondern die Handlungsbedingtheit: ein Modell, in dem man handeln kann, ist ein Simulator, eines, das man nur ansehen kann, ist ein Film. Für die Rechenfrage ist das die schwerste Trainingsart auf dem Board, und anders als die Agentenkarten hängt sie nicht daran, dass ein Sprachmodell gut genug ist, damit sich Tokens rechnen."),
    E("NVIDIA Cosmos; DeepMind Genie; Microsoft Research Muse","NVIDIA Cosmos; DeepMind Genie; Microsoft Research Muse"),

  document.getElementById('thesis').innerHTML = u.thesis;
  document.getElementById('legDataH').textContent = u.legData;
  document.getElementById('legSolid').textContent = u.legSolid;
  document.getElementById('legMid').textContent = u.legMid;
  document.getElementById('legThin').textContent = u.legThin;
  document.getElementById('legMatH').textContent = u.legMat;
  document.getElementById('legProd').textContent = u.mProd;
  document.getElementById('legEarly').textContent = u.mEarly;
  document.getElementById('legPilot').textContent = u.mPilot;
  document.getElementById('legRes').textContent = u.mRes;
  document.getElementById('legGrowH').textContent = u.legGrow;
  document.getElementById('legGExp').textContent = u.gExp;
  document.getElementById('legGStr').textContent = u.gStr;
  document.getElementById('legGSte').textContent = u.gSte;
  document.getElementById('legGNas').textContent = u.gNas;
  document.getElementById('lblCluster').textContent = u.lblCluster;
  document.getElementById('lblMat').textContent = u.lblMat;
  document.getElementById('lblGrow').textContent = u.lblGrow;
  document.getElementById('lblQual').textContent = u.lblQual;
  document.getElementById('legendToggleTxt').textContent = u.legendLbl;
  document.getElementById('filtToggleTxt').textContent = u.filtersLbl;
  for(const id of ['brTitle','brP1','brP2','brNote','brF1v','brF1l','brF2v','brF2l',
                   'brF3v','brF3l','brCardK','brCardT','brCardS','brCardG','cdTitle','cdNote']){
    const el = document.getElementById(id); if(el) el.innerHTML = u[id];
  }
  const cs = computeStat();
  for(const id of ['cdP1','cdP2']){
    const el = document.getElementById(id); if(!el) continue;
    el.innerHTML = u[id].replace(/__HOCH__/g,cs.hoch).replace(/__MITTEL__/g,cs.mittel)
      .replace(/__GERING__/g,cs.gering).replace(/__SUB__/g,cs.sub)
      .replace(/__SINF__/g,cs.schwerInf).replace(/__STRAIN__/g,cs.schwerTrain)
      .replace(/__N__/g,UC.length);
  }
  document.getElementById('lblComp').textContent = u.lblComp;
  document.getElementById('search').placeholder = u.searchPh;
  document.getElementById('empty').textContent = u.empty;
  document.getElementById('footerTxt').innerHTML = u.footer;
  renderDist();
}

function renderDist(){
  const u = UI[lang];
  const s = UC.filter(x=>x.q===3).length, m = UC.filter(x=>x.q===2).length, t = UC.filter(x=>x.q===1).length;
  const g = UC.filter(x=>x.g==='explosive'||x.g==='strong').length;
  document.getElementById('dist').innerHTML =
    '<div class="dist-item dist-total"><div class="dist-num">'+UC.length+'</div><div class="dist-label">'+u.distUC+'</div></div>'+
    '<div class="dist-item"><div class="dist-num g">'+g+'</div><div class="dist-label">'+u.distGrow+'</div></div>'+
    '<div class="dist-item"><div class="dist-num s">'+s+'</div><div class="dist-label">'+u.distSolid+'</div></div>'+
    '<div class="dist-item"><div class="dist-num m">'+m+'</div><div class="dist-label">'+u.distMid+'</div></div>'+
    '<div class="dist-item"><div class="dist-num t">'+t+'</div><div class="dist-label">'+u.distThin+'</div></div>'+
    '<div class="dist-item"><div class="dist-num" style="color:#7FD0C4">'+CLUSTERS.length+'</div><div class="dist-label">'+u.distCl+'</div></div>';
}

function buildChips(){
  const u = UI[lang];
  const cc = document.getElementById('clusterChips');
  cc.querySelectorAll('.chip').forEach(x=>x.remove());
  const allBtn = mkChip(u.all, fCluster===0, function(){fCluster=0; syncCluster(); apply();});
  allBtn.dataset.cl="0"; cc.appendChild(allBtn);
  CLUSTERS.forEach(function(c){
    const b = mkChip(c.n+" · "+T(c.short), fCluster===c.n, function(){fCluster=c.n; syncCluster(); apply();});
    b.dataset.cl=c.n; cc.appendChild(b);
  });
  const mc = document.getElementById('matChips'); mc.innerHTML='';
  MATS.forEach(function(m){
    const b = mkChip(u[m.uiKey], fMat.has(m.k), function(){toggle(fMat,m.k); b.setAttribute('aria-pressed', fMat.has(m.k)); apply();});
    mc.appendChild(b);
  });
  const gc = document.getElementById('growChips'); gc.innerHTML='';
  ['explosive','strong','steady','nascent'].forEach(function(k){
    const b = mkChip(GROW[k].glyph+' '+GROW_LABELS[lang][k], fGrow.has(k), function(){toggle(fGrow,k); b.setAttribute('aria-pressed', fGrow.has(k)); apply();});
    b.classList.add('g'); gc.appendChild(b);
  });
  const pc = document.getElementById('compChips'); pc.innerHTML='';
  [3,2,1,0].forEach(function(k){
    const b = mkChip(u[CI_KEY[k]], fComp.has(k), function(){toggle(fComp,k); b.setAttribute('aria-pressed', fComp.has(k)); apply();});
    b.classList.add('c'); pc.appendChild(b);
  });
  const qc = document.getElementById('qualChips'); qc.innerHTML='';
  [3,2,1].forEach(function(k){
    const b = mkChip(QUAL_LABELS[lang][k], fQual.has(k), function(){toggle(fQual,k); b.setAttribute('aria-pressed', fQual.has(k)); apply();});
    b.classList.add('q'); qc.appendChild(b);
  });
}
function mkChip(txt, pressed, fn){
  const b=document.createElement('button');
  b.className='chip'; b.textContent=txt; b.setAttribute('aria-pressed', pressed);
  b.addEventListener('click', fn); return b;
}
function toggle(set,val){ if(set.has(val)){set.delete(val);}else{set.add(val);} }
function syncCluster(){
  document.querySelectorAll('#clusterChips .chip').forEach(function(b){
    b.setAttribute('aria-pressed', String(Number(b.dataset.cl)===fCluster));
  });
}

function meterHTML(q){ return '<span class="meter q'+q+'" title="'+QUAL_LABELS[lang][q]+'"><i class="seg"></i><i class="seg"></i><i class="seg"></i></span>'; }
function matHTML(mat){ const m = MATS.find(x=>x.k===mat); return '<span class="mpill '+m.cls+'">'+UI[lang][m.uiKey]+'</span>'; }
function metaHTML(x){
  const g = GROW[x.g];
  return '<div class="metaline">'+
           '<span class="gpart"><span class="garrow '+g.cls+'">'+g.glyph+'</span> '+T(x.glab)+'</span>'+
           '<span class="mdot">·</span>'+
           '<span class="cpart"><span class="ci ci'+x.ci+'">'+UI[lang][CI_KEY[x.ci]]+'</span> '+
             (CK_LABEL[lang]||CK_LABEL.en)[x.ck]+'</span>'+
         '</div>';
}
function srcHTML(x){
  const url = URLS[x.name.en];
  const label = T(x.src);
  if(url){
    return '<a class="srclink" href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+' ↗</a>';
  }
  return label;
}
function firmsHTML(x){
  const list = COMPANIES[x.name.en];
  if(!list || !list.length) return '';
  return '<div class="firms"><b>'+UI[lang].firmsLabel+'</b>'+list.map(function(f){
    return '<a class="firmlink" href="'+f.u+'" target="_blank" rel="noopener noreferrer">'+f.n+' \u2197</a>';
  }).join('')+'</div>';
}

function buildBoard(){
  const u = UI[lang];
  const board = document.getElementById('board');
  board.innerHTML = CLUSTERS.map(function(c){
    const catLabel = c.cat==='phys'?u.physical:(c.cat==='soft'?u.software:u.infra);
    const cards = UC.filter(x=>x.c===c.n).map(function(x){
      const txt = (T(x.name)+' '+x.prov+' '+T(x.metric)+' '+T(x.detail)+' '+T(x.glab)).replace(/<[^>]+>/g,'').toLowerCase().replace(/"/g,'');
      return '<div class="card" data-c="'+x.c+'" data-mat="'+x.mat+'" data-q="'+x.q+'" data-g="'+x.g+'" data-ci="'+x.ci+'" data-txt="'+txt+'">'+
        '<button class="card-btn" aria-expanded="false">'+
          '<div class="card-top"><div>'+
            '<div class="uc-name">'+T(x.name)+'</div>'+
            '<div class="uc-prov">'+x.prov+'</div>'+
          '</div>'+matHTML(x.mat)+'</div>'+
          '<div class="card-mid">'+meterHTML(x.q)+'<span class="metric">'+T(x.metric)+'</span></div>'+
          metaHTML(x)+
          '<div class="expand-hint"><span class="chev">▸</span> '+u.detailsHint+'</div>'+
        '</button>'+
        '<div class="detail"><div class="detail-in">'+
          T(x.detail)+
          '<div class="flag '+x.flag.t+'">'+T(x.flag.x)+'</div>'+
          '<div class="src"><b>'+u.srcLabel+'</b> '+srcHTML(x)+'</div>'+firmsHTML(x)+
        '</div></div>'+
      '</div>';
    }).join('');
    return '<section class="cluster" data-cl="'+c.n+'">'+
      '<div class="cl-head">'+
        '<div class="cl-num">'+String(c.n).padStart(2,'0')+'</div>'+
        '<div class="cl-meta"><h2 class="cl-title">'+T(c.title)+'<span class="cl-tag '+c.cat+'">'+catLabel+'</span></h2><p class="cl-kern">'+T(c.kern)+'</p></div>'+
        '<div class="cl-verdict">'+T(c.verdict)+'</div>'+
      '</div><div class="grid">'+cards+'</div></section>';
  }).join('');

  board.querySelectorAll('.card-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const card = btn.closest('.card');
      const open = card.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
  });
}

function apply(){
  const u = UI[lang];
  let shown=0;
  document.querySelectorAll('.cluster').forEach(function(sec){
    let any=false;
    sec.querySelectorAll('.card').forEach(function(card){
      const okC = fCluster===0 || Number(card.dataset.c)===fCluster;
      const okM = fMat.size===0 || fMat.has(card.dataset.mat);
      const okQ = fQual.size===0 || fQual.has(Number(card.dataset.q));
      const okG = fGrow.size===0 || fGrow.has(card.dataset.g);
      const okCi = fComp.size===0 || fComp.has(Number(card.dataset.ci));
      const okT = !fText || card.dataset.txt.indexOf(fText)!==-1;
      const ok = okC&&okM&&okQ&&okG&&okCi&&okT;
      card.classList.toggle('hidden', !ok);
      if(ok){any=true; shown++;}
    });
    sec.classList.toggle('hidden', !any);
  });
  document.getElementById('empty').style.display = shown===0 ? 'block':'none';
  document.getElementById('countOut').textContent = shown + ' / ' + UC.length + ' ' + u.countSuffix;
  syncFilterCount();
}

document.getElementById('search').addEventListener('input', function(e){
  fText = e.target.value.trim().toLowerCase(); apply();
});


/* ---------- Aufklappbare Bloecke ----------
   Legende, Zusatzfilter und das Rechenbedarf-Argument starten eingeklappt.
   Ein aktiver Zusatzfilter waere sonst unsichtbar, deshalb steht die Anzahl
   am Schalter und der Block klappt automatisch auf, sobald einer gesetzt ist. */
function wireDisclosure(btnId, bodyId){
  const btn = document.getElementById(btnId), body = document.getElementById(bodyId);
  if(!btn || !body) return;
  btn.addEventListener('click', function(){
    const open = body.hasAttribute('hidden');
    if(open){ body.removeAttribute('hidden'); } else { body.setAttribute('hidden',''); }
    btn.setAttribute('aria-expanded', String(open));
  });
}
wireDisclosure('legendToggle','legendBody');
wireDisclosure('filtToggle','moreFilters');
wireDisclosure('warumToggle','warumBody');
wireDisclosure('bridgeToggle','bridgeBody');

function syncFilterCount(){
  const n = fMat.size + fGrow.size + fComp.size + fQual.size;
  const el = document.getElementById('filtCount');
  if(el) el.textContent = n ? '('+n+')' : '';
  if(n){
    const body = document.getElementById('moreFilters'), btn = document.getElementById('filtToggle');
    if(body && body.hasAttribute('hidden')){ body.removeAttribute('hidden'); btn.setAttribute('aria-expanded','true'); }
  }
}
setLang('en');
</script>
